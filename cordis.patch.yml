# dsh-llm-error-retry — Profile Bundle 自带补丁：把宿主半插进 host 组合。
# 浏览器半（设置页分区）由 client-modules 扫描本包 package.json 的 dsh.client 声明自动并入 GUI 启动图。
# 默认规则在这里定义；日常改规则请直接用 GUI（设置 → LLM 错误重试），
# 它会写入 ~/.dsh/llm-error-retry/rules.json 并优先于本文件。
# 想固定改 YAML：在 ~/.dsh/cordis.patch.yml 加同 id 行整体覆盖 config（HOME 层优先于 bundle 层）。
- insert:
    - id: llm-error-retry
      name: ./host.v19.mjs
      config:
        # 模型不支持多模态时：自动往上下文注入提示，而不是直接报错。
        notMultimodal:
          enabled: true
          maxNotices: 1    # 每轮最多注入几条（1–10）；text 省略则用内置文案
        # 服务端 Retry-After 提示最多被采信多久（毫秒）。0 = 完全忽略提示、只按规则节奏。
        honorRetryAfterMaxMs: 60000
        # 首字超时：请求发出后多久还没有第一个字（正文/思考/工具调用任一）就中断本次请求
        # 并按 TIMEOUT 失败上报。可再配一条规则码 TIMEOUT 让它自动重试。范围 1000–3600000 毫秒。
        firstTokenTimeout:
          enabled: true
          timeoutMs: 180000
        # 模型输出达到 token 上限被截断时，自动注入一条消息让它接着输出（免人工打「继续」）
        maxTokens:
          enabled: true      # 关掉则恢复原样：截断后等你手动继续
          text: '继续'        # 注入内容
          maxContinues: 5    # 每轮最多自动续写 5 次（只约束截断续写，防死循环；
                             # 工具步接力不计此限）
          delayMs: 3000      # 截断续写前休眠 3 秒，别打爆 provider（工具步接力不休眠）
          restartTurns: 10   # 轮次以粘性 max-tokens 收尾时，最多连开 10 个新轮
          restartDelayMs: 1200  # 重开前等旧 driver 收敛的时间（不能省：running 阶段
                             # 投递的唤醒会被 agent-loop 丢弃）
        rules:
          - code: '429'        # HTTP 状态码 429（限流）；也可写机器码 RATE_LIMIT
            delayMs: 60000     # 命中后休眠 60 秒再重新请求
            maxRetries: 10     # 该错误码最多重试 10 次，耗尽后错误上报
          - code: 'msg~finish_reason: error'
            delayMs: 10000     # provider 以 finish_reason 终止请求：休眠 10 秒重试
          # 更多规则按同样格式追加（按顺序取第一条命中），例如按 provider 响应字段命中：
          # - code: type=insufficient_quota
          #   delayMs: 60000
          #   maxRetries: 10
